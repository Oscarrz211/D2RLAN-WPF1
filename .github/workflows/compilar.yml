name: Compilar D2RLAN-WPF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Buscar proyectos
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.csproj |
            Select-Object -ExpandProperty FullName

      - name: Compilar proyectos
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Recurse -Filter *.csproj
          if (-not $projects) {
            throw "No se encontraron archivos .csproj"
          }

          foreach ($project in $projects) {
            dotnet restore $project.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Error restaurando $($project.Name)"
            }

            dotnet build $project.FullName `
              --configuration Release --no-restore

            if ($LASTEXITCODE -ne 0) {
              throw "Error compilando $($project.Name)"
            }
          }

name: Build D2RLAN-WPF

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compile on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore src/D2RLAN/D2RLAN.sln

      - name: Build solution
        shell: pwsh
        run: |
          msbuild src/D2RLAN/D2RLAN.sln /p:Configuration=Release /m /verbosity:minimal

      - name: Collect compiled files
        if: success()
        shell: pwsh
        run: |
          $source = "src/D2RLAN/D2RLAN/bin/Release"

          if (-not (Test-Path $source)) {
            Write-Error "Build output fold

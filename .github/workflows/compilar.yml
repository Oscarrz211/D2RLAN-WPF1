name: Build D2RLAN-WPF

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compile on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        shell: pwsh
        run: nuget restore src/D2RLAN/D2RLAN.sln

      - name: Compile solution
        shell: pwsh
        run: msbuild src/D2RLAN/D2RLAN.sln /p:Configuration=Release /m /verbosity:minimal

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: D2RLAN-WPF-Compiled
          path: |
            src/D2RLAN/D2RLAN/bin/Release/
            src/D2RLAN/bin/Release/
          if-no-files-found: warn
          retention-days: 7

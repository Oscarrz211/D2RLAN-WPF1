name: Compilar D2RLAN-WPF on: workflow_dispatch: jobs: build: runs-on: windows-latest steps: - name: Descargar codigo fuente uses: actions/checkout@v4 - name: Configurar MSBuild uses: microsoft/setup-msbuild@v2 - name: Configurar NuGet uses: NuGet/setup-nuget@v2 - name: Restaurar paquetes NuGet shell: pwsh run: | nuget restore src/D2RLAN/D2RLAN/D2RLAN.csproj - name: Compilar D2RLAN shell: pwsh run: | msbuild src/D2RLAN/D2RLAN/D2RLAN.csproj ` /p:Configuration=Release ` /p:RestorePackages=false ` /m ` /verbosity:minimal - name: Publicar archivos compilados if: success() uses: actions/upload-artifact@v4 with: name: D2RLAN-Compilado path: src/D2RLAN/D2RLAN/bin/Release/ if-no-files-found: error retention-days: 7
